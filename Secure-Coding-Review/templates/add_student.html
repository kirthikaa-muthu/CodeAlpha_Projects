<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Student | SecureStudent</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<div class="app-layout">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="brand">
            <div class="brand-icon">🛡️</div>

            <span class="brand-name">
                SecureStudent
            </span>

            <span class="brand-tag">
                V1
            </span>
        </div>


        <div class="menu-title">MENU</div>

        <a href="{{ url_for('home') }}" class="nav-link">
            <span class="nav-icon">⌂</span>
            Dashboard
        </a>

        <a href="{{ url_for('students') }}" class="nav-link">
            <span class="nav-icon">👥</span>
            Students
        </a>

        <a href="{{ url_for('add_student') }}" class="nav-link active">
            <span class="nav-icon">＋</span>
            Add Student
        </a>


        <div class="menu-title">OTHER</div>

        <a href="{{ url_for('students') }}" class="nav-link">
            <span class="nav-icon">⌕</span>
            Search
        </a>

        <a href="{{ url_for('logout') }}" class="nav-link">
            <span class="nav-icon">↪</span>
            Logout
        </a>

    </aside>


    <!-- MAIN -->

    <main class="main-content">

        <div class="topbar">

            <div class="search-box">
                <span>⌕</span>

                <input
                    type="text"
                    placeholder="Search students..."
                    onkeydown="if(event.key === 'Enter') window.location.href='/students?search=' + encodeURIComponent(this.value)"
                >
            </div>


            <div class="profile">

                <div>
                    <div class="profile-name">
                        {{ session.get("username") }}
                    </div>

                    <div class="profile-role">
                        Administrator
                    </div>
                </div>

                <div class="profile-avatar">
                    {{ session.get("username")[0]|upper }}
                </div>

            </div>

        </div>


        <div class="page-heading">

            <h1>
                Add Student
            </h1>

            <p>
                Register a new student in the management system.
            </p>

        </div>


        <div class="card form-card">

            <div class="card-header">

                <div>

                    <h2 class="card-title">
                        Student Information
                    </h2>

                    <p style="color:#89919a; font-size:13px;">
                        Enter the student's details below.
                    </p>

                </div>

            </div>


            <form method="POST">

                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="e.g. Alice Johnson"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="e.g. alice@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="course">
                        Course / Module
                    </label>
                    <select
                        id="course"
                        name="course"
                        required
                    >
                    <option value="" disabled selected>
                        Select a module
                    </option>

                    {% for module in modules %}

                        <option value="{{ module['name'] }}">
                            {{ module['name'] }}
                        </option>

                    {% endfor %}

                </select>

            </div>

                <div class="form-group">

                    <label for="year">
                        Academic Year
                    </label>

                    <input
                        type="number"
                        id="year"
                        name="year"
                        min="1"
                        max="5"
                        placeholder="e.g. 2"
                        required
                    >

                </div>


                <div style="display:flex; gap:10px; margin-top:25px;">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Add Student
                    </button>

                    <a
                        href="{{ url_for('students') }}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </main>

</div>

</body>

</html>
