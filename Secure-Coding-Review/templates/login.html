<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | SecureStudent</title>

    <style>

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #f2f2fa;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: #26313b;
        }


        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }


        .login-card {
            background: white;

            border-radius: 24px;

            padding: 42px;

            box-shadow:
                0 15px 45px rgba(50, 55, 80, 0.08);
        }


        .logo {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }


        .logo-icon {
            width: 65px;
            height: 65px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            background: #dcdcff;

            font-size: 32px;
        }


        h1 {
            text-align: center;
            margin: 0;

            font-size: 27px;
            letter-spacing: -0.8px;
        }


        .subtitle {
            text-align: center;

            color: #89919a;

            font-size: 13px;

            margin-top: 8px;
            margin-bottom: 30px;
        }


        .form-group {
            margin-bottom: 18px;
        }


        label {
            display: block;

            font-size: 13px;
            font-weight: 700;

            margin-bottom: 7px;
        }


        input {
            width: 100%;
            box-sizing: border-box;

            padding: 13px;

            border: 1px solid #ececf3;

            border-radius: 11px;

            outline: none;

            background: #fafafd;

            font-size: 14px;
        }


        input:focus {
            border-color: #8d8cf5;
            background: white;
        }


        button {
            width: 100%;

            border: none;

            border-radius: 11px;

            padding: 13px;

            background: #8d8cf5;

            color: white;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            margin-top: 8px;
        }


        button:hover {
            opacity: 0.88;
        }


        .security-note {
            margin-top: 25px;

            padding: 12px;

            border-radius: 11px;

            background: #f2f2fa;

            text-align: center;

            font-size: 11px;

            color: #89919a;
        }

    </style>

</head>


<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">

            <div class="logo-icon">
                🛡️
            </div>

        </div>


        <h1>
            SecureStudent
        </h1>


        <div class="subtitle">
            Student Management System
        </div>


        <form method="POST">

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button type="submit">
                Sign In
            </button>

        </form>


        <div class="security-note">
            🛡️ Secure access to student records
        </div>

    </div>

</div>

</body>

</html>
